[project]
name = "gaas-cli"
dynamic = [ "version" ]
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15.2"
dependencies = [
  "meilisearch>=0.43.0",
  "pandas>=2.3.3",
  "pyarrow>=22.0.0",
  "pydantic>=2.14.1",
  "python-dotenv>=1.2.4",
  "python-frontmatter>=1.3.0",
  "pyzotero>=1.16.0",
  "requests>=2.34.2",
  "rich>=14.3.4",
  "typer>=0.27.3",
]

[project.scripts]
gaas = "gaas_cli.main:app"

[tool.flake8]
max-line-length = 88

[tool.uv]
package = true

[dependency-groups]
dev = [
  "black>=25.12.0",
  "ruff>=0.17.3",
]

[build-system]
requires = [
  "hatchling",
  "uv-dynamic-versioning"
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# The package has no LICENSE of its own: the sdist takes the root one, and the
# wheel built from it (as `uv build` does) carries it under dist-info/licenses/.
# A wheel built straight from this directory (`uv build --wheel`, `hatch
# build`) would not.
[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"

[tool.uv-dynamic-versioning]
vcs = "git"
pattern-prefix = "gaas-cli-"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.hooks.version]
path = "src/gaas_cli/_version.py"
template = '''
version = "{version}"
'''
