variables:
  UV_VERSION: 0.9.12
  PYTHON_VERSION: '3.13'
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  UV_PUBLISH_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi'
  UV_PUBLISH_USERNAME: gitlab-ci-token
  UV_PUBLISH_PASSWORD: '${CI_JOB_TOKEN}'

# `deploy` sits after `test` deliberately: a `main` that fails its own lint,
# typecheck or tests should not publish documentation from itself. Decouple
# with `needs: []` on `deploy:docs` if that ever costs more than it buys.
stages:
  - test
  - publish
  - deploy

# Nothing ran on a merge request before this job, so lint, typecheck and test
# only ever gated a release (`pnpm release` runs all three). One job rather
# than three: the install and the generated Nuxt types dominate the runtime,
# and splitting would pay for them once per job.
test:packages:
  stage: test
  # Not the 22.16.0 the docs job pins. Loading Nuxt in `test/module/tasks.test.ts`
  # goes through `require()` of an ES module, which Node only allows unflagged
  # from 22.18; on 22.16 the suite fails with `default is not defined`. 24 is
  # what the project is developed against.
  image: node:24-bookworm
  # A new push supersedes the run it interrupts.
  interruptible: true
  variables:
    # Corepack otherwise asks before fetching the pinned pnpm, and waits.
    COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - pnpm config set store-dir .pnpm-store
  script:
    # `blendtype` has to be built before anything that imports it typechecks,
    # and `dev:prepare` generates the `.nuxt` tsconfigs `ui` and `wiki` are
    # checked against — neither has a `prepack`, so `build` alone misses them.
    - pnpm install --frozen-lockfile
    - pnpm build
    - pnpm dev:prepare
    - pnpm lint
    - pnpm typecheck
    - pnpm test
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

publish:gaas-cli:
  stage: publish
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_PROJECT: packages/gaas-cli
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  before_script:
    # git is required by uv-dynamic-versioning (dunamai) to derive the version from the tag
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
  script:
    - uv build
    - uv publish packages/gaas-cli/dist/*.whl
    - uv cache prune --ci
  rules:
    - if: '$CI_COMMIT_TAG =~ /^gaas-cli-v\d+\.\d+\.\d+.*$/'
      when: always
    - when: never

deploy:docs:
  stage: deploy
  image: node:22.16.0-bookworm
  # Functions that should be executed before the build script is run
  pages:
    publish: docs/.output/public
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest-10 --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install
    - echo "Building the docs..."
    - cd docs
    - echo "Generating the static files..."
    - export NUXT_UI_PRO_LICENSE=${NUXT_UI_PRO_LICENSE} && pnpm run generate
    - echo "Copying the generated files to the public folder..."
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  artifacts:
    paths:
      # The directory that contains the built files to be published
      - docs/.output/public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "docs"'
      when: on_success
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: on_success
    - when: never # Fallback: skip everything else
