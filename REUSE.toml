# Who holds the copyright in each file and under which licence (ADR 0007).
# The first entry covers everything. Each later one wins over the entries
# above it: a third-party source, which overrides whatever its files say, or,
# at the end, files left unlabelled on purpose.
#
# Institut Pasteur's line also stands in every entry for a third-party file
# GaaS changed, each with the contributor line, so a new holder wording
# changes all of them.
version = 1

# GaaS's own work: code, docs, the logo, lockfiles and generated files.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025 Institut Pasteur"
SPDX-License-Identifier = "MIT"
SPDX-FileContributor = "Rémi Planel <rplanel@gmail.com>"

